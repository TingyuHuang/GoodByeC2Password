[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c2pw-convert"
version = "0.1.0"
description = "Convert Synology C2 Password CSV exports to Bitwarden or 1Password CSV."
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

[project.scripts]
c2pw-convert = "c2pw_convert.cli:main"

[tool.setuptools.packages.find]
include = ["c2pw_convert*"]
exclude = ["tests*"]
